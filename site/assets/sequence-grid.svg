<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 125">
  <title>Decorative nucleotide pattern</title>
  <g id="static"/>
  <style>
    /* A quiet left-to-right wave; tiles retain their nucleotide colors. */
    .sequence-tiles > rect:not([opacity=".12"]) {
      animation: column-highlight 7s ease-in-out infinite;
    }
    .sequence-tiles > rect:nth-of-type(12n + 1) { animation-delay: -7.0s; }
    .sequence-tiles > rect:nth-of-type(12n + 2) { animation-delay: -6.7s; }
    .sequence-tiles > rect:nth-of-type(12n + 3) { animation-delay: -6.4s; }
    .sequence-tiles > rect:nth-of-type(12n + 4) { animation-delay: -6.1s; }
    .sequence-tiles > rect:nth-of-type(12n + 5) { animation-delay: -5.8s; }
    .sequence-tiles > rect:nth-of-type(12n + 6) { animation-delay: -5.5s; }
    .sequence-tiles > rect:nth-of-type(12n + 7) { animation-delay: -5.2s; }
    .sequence-tiles > rect:nth-of-type(12n + 8) { animation-delay: -4.9s; }
    .sequence-tiles > rect:nth-of-type(12n + 9) { animation-delay: -4.6s; }
    .sequence-tiles > rect:nth-of-type(12n + 10) { animation-delay: -4.3s; }
    .sequence-tiles > rect:nth-of-type(12n + 11) { animation-delay: -4.0s; }
    .sequence-tiles > rect:nth-of-type(12n + 12) { animation-delay: -3.7s; }
    @keyframes column-highlight {
      0%, 32%, 100% { opacity: .24; }
      16% { opacity: .55; }
    }
    #static:target ~ .sequence-tiles > rect { animation: none; }
    @media (prefers-reduced-motion: reduce) {
      .sequence-tiles > rect:not([opacity=".12"]) { animation: none; }
    }
  </style>

project:
  type: book
  output-dir: _book
# NOTE: Before running `quarto render`, mirror the repo-root /assignments
# directory into course_notes/assignments/ by running:
#   python site_tools/sync_assignments.py
# (the CI workflow does this automatically). Assignment .qmd files live
# at the repo root for student-facing visibility but Quarto cannot link
# to files outside its project dir on GitHub Pages, so we copy them in.

book:
  title: "MATH 4310 Computational Bioinformatics"
  subtitle: "Course Notes"
  author:
    - name: "Chris Miles"
      email: "chris.miles@utah.edu"
      affiliation: "Department of Mathematics, University of Utah"
  description: "Course notes for MATH 4310 Computational Bioinformatics, an upper-division undergraduate theory-and-algorithms class at the University of Utah. Covers sequence alignment, assembly graphs, hidden Markov models, phylogenetics, omics matrices, clustering, and mechanistic models."
  site-url: "https://chris-miles.github.io/math4310compbioinf/"
  favicon: "img/UU Logo-CTR_RGB.svg"
  sidebar:
    logo: "img/UU Logo-CTR_RGB.svg"
    style: floating
    collapse-level: 1
  page-navigation: true
  chapters:
    - index.qmd
    - using-notes.qmd
    - part: "Foundations"
      chapters:
        - lessons/lesson01-first-problem.qmd
        - lessons/lesson02-log-odds-scoring.qmd
    - part: "Pairwise Alignment"
      chapters:
        - lessons/lesson03-recurrences-and-alignment.qmd
        - lessons/lesson04-global-alignment-correctness.qmd
        - lessons/lesson05-local-alignment.qmd
        - lessons/lesson06-affine-gaps-seed-extend.qmd
    - part: "Assembly Graphs"
      chapters:
        - lessons/lesson07-reads-kmers-de-bruijn.qmd
        - lessons/lesson08-eulerian-paths-repeats.qmd
    - part: "Probabilistic Sequence Models"
      chapters:
        - lessons/lesson09-probability-markov-chains.qmd
        - lessons/lesson10-cpg-likelihood-ratios.qmd
        - lessons/lesson11-hidden-markov-models.qmd
        - lessons/lesson12-viterbi-decoding.qmd
        - lessons/lesson13-forward-backward.qmd
    - part: "Phylogenetics"
      chapters:
        - lessons/lesson14-distances-upgma.qmd
        - lessons/lesson15-parsimony-fitch.qmd
    - part: "Omics Matrices and Testing"
      chapters:
        - lessons/lesson16-expression-matrices-pca.qmd
        - lessons/lesson17-pca-in-practice.qmd
        - lessons/lesson18-multiple-testing-fdr.qmd
    - part: "Clustering and Single-Cell Data"
      chapters:
        - lessons/lesson19-clustering-neighborhood-graphs.qmd
        - lessons/lesson20-embeddings-single-cell.qmd
    - part: "Mechanistic Models"
      chapters:
        - lessons/lesson21-gene-regulation-odes.qmd
        - lessons/lesson22-hill-functions-toggle-switch.qmd
    - part: "Synthesis"
      chapters:
        - lessons/lesson23-choosing-a-method.qmd
        - lessons/lesson24-modern-frontiers.qmd
    - part: "Assignments"
      chapters:
        - assignments/ps01-scoring-kmers.qmd
        - assignments/ps02-global-alignment.qmd
        - assignments/project-workshops.qmd
  appendices:
    - appendices/computing-conventions.qmd
    - appendices/math-refreshers.qmd
    - appendices/notation.qmd

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: true
    number-sections: true
    code-copy: true
    code-overflow: wrap
    fig-width: 6
    fig-height: 4
    fig-dpi: 150
    crossrefs-hover: true
    citations-hover: true
    footnotes-hover: true
    highlight-style: tango
    code-line-numbers: true
    date-modified: last-modified
    include-after-body:
      - _includes/expand-first-part-on-index.html
      - _includes/inject-author-email.html
    grid:
      sidebar-width: 220px
      body-width: 1280px
      margin-width: 220px
      gutter-width: 1.5rem

execute:
  echo: true
  warning: false
  message: false
  freeze: auto

language:
  title-block-modified: "Last Updated"

bibliography: references.bib
